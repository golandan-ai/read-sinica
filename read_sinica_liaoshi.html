<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liaoshi Reader - Sinica Navigator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2rem;
            color: #1a1a2e;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px 18px;
            font-size: 1.2rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: #4a90d9;
        }

        .chapter-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            min-height: 60px;
        }

        .chapter-info .cn {
            font-size: 1.3rem;
            color: #1a1a2e;
            font-weight: 600;
        }

        .chapter-info .section {
            color: #666;
            margin-top: 5px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 14px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .btn-primary {
            background: #4a90d9;
            color: white;
        }

        .btn-primary:hover {
            background: #357abd;
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .command-box {
            background: #1a1a2e;
            color: #4ade80;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
            margin-bottom: 20px;
            word-break: break-all;
            display: none;
        }

        .command-box.show {
            display: block;
        }

        .ranges {
            font-size: 0.85rem;
            color: #666;
        }

        .ranges table {
            width: 100%;
            margin-top: 10px;
            border-collapse: collapse;
        }

        .ranges td {
            padding: 5px 10px;
            border-bottom: 1px solid #eee;
        }

        .ranges td:first-child {
            font-weight: 500;
            color: #333;
        }

        .copied {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4ade80;
            color: #1a1a2e;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .copied.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Liaoshi Reader</h1>
        <p class="subtitle">Navigate to any chapter of the History of Liao</p>

        <div class="input-group">
            <label for="chapter">Chapter Number (1-116)</label>
            <input type="number" id="chapter" min="1" max="116" placeholder="Enter chapter number..." autofocus>
        </div>

        <div class="chapter-info" id="chapterInfo">
            <div class="cn" id="chapterCn">Enter a chapter number</div>
            <div class="section" id="chapterSection"></div>
        </div>

        <div class="buttons">
            <button class="btn-primary" onclick="openSinica()">Open Sinica</button>
            <button class="btn-secondary" onclick="copyCommand()">Copy Command</button>
        </div>

        <div class="command-box" id="commandBox">
            python navigate_sinica.py <span id="cmdNum">1</span>
        </div>

        <div class="ranges">
            <strong>Chapter Ranges:</strong>
            <table>
                <tr><td>1-30</td><td>Annals</td></tr>
                <tr><td>31-60</td><td>Treatises</td></tr>
                <tr><td>61-70</td><td>Tables</td></tr>
                <tr><td>71-116</td><td>Biographies</td></tr>
            </table>
        </div>
    </div>

    <div class="copied" id="copied">Copied!</div>

    <script>
        const CHINESE_NUMS = {
            1:'一',2:'二',3:'三',4:'四',5:'五',6:'六',7:'七',8:'八',9:'九',10:'十',
            11:'十一',12:'十二',13:'十三',14:'十四',15:'十五',16:'十六',17:'十七',18:'十八',19:'十九',20:'二十',
            21:'二十一',22:'二十二',23:'二十三',24:'二十四',25:'二十五',26:'二十六',27:'二十七',28:'二十八',29:'二十九',30:'三十',
            31:'三十一',32:'三十二',33:'三十三',34:'三十四',35:'三十五',36:'三十六',37:'三十七',38:'三十八',39:'三十九',40:'四十',
            41:'四十一',42:'四十二',43:'四十三',44:'四十四',45:'四十五',46:'四十六',47:'四十七',48:'四十八',49:'四十九',50:'五十',
            51:'五十一',52:'五十二',53:'五十三',54:'五十四',55:'五十五',56:'五十六',57:'五十七',58:'五十八',59:'五十九',60:'六十',
            61:'六十一',62:'六十二',63:'六十三',64:'六十四',65:'六十五',66:'六十六',67:'六十七',68:'六十八',69:'六十九',70:'七十',
            71:'七十一',72:'七十二',73:'七十三',74:'七十四',75:'七十五',76:'七十六',77:'七十七',78:'七十八',79:'七十九',80:'八十',
            81:'八十一',82:'八十二',83:'八十三',84:'八十四',85:'八十五',86:'八十六',87:'八十七',88:'八十八',89:'八十九',90:'九十',
            91:'九十一',92:'九十二',93:'九十三',94:'九十四',95:'九十五',96:'九十六',97:'九十七',98:'九十八',99:'九十九',100:'一百',
            101:'一百一',102:'一百二',103:'一百三',104:'一百四',105:'一百五',106:'一百六',107:'一百七',108:'一百八',109:'一百九',110:'一百十',
            111:'一百十一',112:'一百十二',113:'一百十三',114:'一百十四',115:'一百十五',116:'一百十六'
        };

        function getSectionInfo(num) {
            if (num >= 1 && num <= 30) return { name: '本紀', nameEn: 'Annals', secNum: num };
            if (num >= 31 && num <= 60) return { name: '志', nameEn: 'Treatises', secNum: num - 30 };
            if (num >= 61 && num <= 70) return { name: '表', nameEn: 'Tables', secNum: num - 60 };
            if (num >= 71 && num <= 116) return { name: '列傳', nameEn: 'Biographies', secNum: num - 70 };
            return null;
        }

        const chapterInput = document.getElementById('chapter');
        const chapterCn = document.getElementById('chapterCn');
        const chapterSection = document.getElementById('chapterSection');
        const cmdNum = document.getElementById('cmdNum');
        const commandBox = document.getElementById('commandBox');

        chapterInput.addEventListener('input', function() {
            const num = parseInt(this.value);
            if (num >= 1 && num <= 116) {
                const cn = CHINESE_NUMS[num];
                const sec = getSectionInfo(num);
                const secCn = CHINESE_NUMS[sec.secNum];

                chapterCn.textContent = `遼史卷${cn}`;
                chapterSection.textContent = `${sec.name}第${secCn} (${sec.nameEn} ${sec.secNum})`;
                cmdNum.textContent = num;
                commandBox.classList.add('show');
            } else {
                chapterCn.textContent = 'Enter a chapter number (1-116)';
                chapterSection.textContent = '';
                commandBox.classList.remove('show');
            }
        });

        function openSinica() {
            const num = parseInt(chapterInput.value);
            if (!num || num < 1 || num > 116) {
                alert('Please enter a valid chapter number (1-116)');
                return;
            }
            // Open Sinica free access URL
            window.open('https://hanchi.ihp.sinica.edu.tw/ihpc/ttswebquery?@hanjiquery', '_blank');

            // Show instruction
            alert(`Sinica opened in new tab.\n\nNavigate: 史 → 正史 → 遼史 → ${getSectionInfo(num).name}\n\nOr run the Python script for automatic navigation.`);
        }

        function copyCommand() {
            const num = parseInt(chapterInput.value) || 1;
            const cmd = `python navigate_sinica.py ${num}`;
            navigator.clipboard.writeText(cmd).then(() => {
                const copied = document.getElementById('copied');
                copied.classList.add('show');
                setTimeout(() => copied.classList.remove('show'), 2000);
            });
        }

        // Handle Enter key
        chapterInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                openSinica();
            }
        });
    </script>
</body>
</html>
